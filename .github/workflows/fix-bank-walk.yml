name: Fix bank to Hongqiao walk

on:
  push:
    paths:
      - '.github/workflows/fix-bank-walk.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bank to Hongqiao segment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<details class="stop"><summary><div class="stop-icon">🚕</div><div><div class="stop-title">中國工商銀行 → 上海虹橋站（北進站口）</div><div class="stop-meta">必須打車前往｜避免錯過高鐵</div></div><div class="chev">⌄</div></summary><div class="stop-body"><p>辦完銀行業務後直接<b>打車</b>前往上海虹橋站，這段不搭地鐵，避免耽誤後續高鐵班次。</p><div class="pills"><span class="pill red">去火車站＝打車</span></div></div></details>'
          new = '<details class="stop"><summary><div class="stop-icon">🚶</div><div><div class="stop-title">中國工商銀行 → 上海虹橋站（北進站口）</div><div class="stop-meta">步行前往｜就在附近</div></div><div class="chev">⌄</div></summary><div class="stop-body"><p>辦完銀行業務後直接<b>步行</b>前往上海虹橋站（北進站口），這段距離近，不用另外叫車。</p><div class="pills"><span class="pill green">步行前往</span></div></div></details>'
          if old not in s:
              raise SystemExit('target snippet not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix bank to Hongqiao route as walking" || exit 0
          git push
