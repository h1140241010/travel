name: Apply Dabaaitu reminder

on:
  push:
    paths:
      - '.github/workflows/apply-dabaitu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reminder
        run: python .github/scripts/patch_dabaitu.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Dabaaitu candy reminder to Yuyuan"
          git push
