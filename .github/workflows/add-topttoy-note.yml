name: Add TOP TOY reminder

on:
  push:
    paths:
      - '.github/workflows/add-topttoy-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add TOP TOY note to Yuyuan itinerary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '<p>傍晚開始慢慢逛、找晚餐，順便等夜景亮燈。</p>'
          insert = target + '<div class="alert">🧸 TOP TOY｜朋友託買：記得去幫朋友買東西。</div>'
          if '🧸 TOP TOY｜朋友託買：記得去幫朋友買東西。' in s:
              raise SystemExit('TOP TOY note already exists')
          if target not in s:
              raise SystemExit('Yuyuan target not found')
          p.write_text(s.replace(target, insert, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add TOP TOY reminder to Yuyuan itinerary" || exit 0
          git push
